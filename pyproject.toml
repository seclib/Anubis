[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anubis-cli"
version = "0.1.0"
description = "Terminal-first autonomous AI agent with Obsidian and Qdrant memory."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0,<1.0",
  "pydantic>=2.0,<3.0",
  "pydantic-settings>=2.0,<3.0",
  "qdrant-client>=1.9.0,<2.0",
  "requests>=2.31.0,<3.0",
  "watchdog>=4.0.0,<5.0",
]

[project.scripts]
anubis = "cli.main:main"

[tool.setuptools.packages.find]
include = ["cli*", "backend*", "modules*"]
