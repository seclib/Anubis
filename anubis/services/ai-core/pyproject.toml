[project]
name = "anubis-ai-core"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "anubis-memory-sdk",
  "anubis-prompt-engine",
  "anubis-tools",
  "fastapi>=0.115",
  "httpx>=0.27",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "structlog>=24.4",
  "uvicorn[standard]>=0.30"
]

[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"
