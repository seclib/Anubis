name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  python:
    name: Python checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile and test
        run: |
          python -m compileall -q agent api app backend cli core executor intelligence knowledge llm memory monitoring rag retrieval runtime services storage tools workers tests
          python -m unittest discover -s tests -p 'test*.py'

  desktop:
    name: Desktop web build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install

      - name: Build desktop web shell
        working-directory: desktop
        run: npm run build
