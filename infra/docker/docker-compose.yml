# Base compose file for Anubis.
# Use docker-compose.dev.yml for hot reload and docker-compose.prod.yml for locked-down production defaults.

name: anubis

x-app-env: &app-env
  ANUBIS_ENV: ${ANUBIS_ENV:-development}
  ANUBIS_LOG_LEVEL: ${ANUBIS_LOG_LEVEL:-INFO}
  ANUBIS_RAG_URL: ${ANUBIS_RAG_URL:-http://rag-service:8001}
  ANUBIS_TOOL_RUNNER_URL: ${ANUBIS_TOOL_RUNNER_URL:-http://tool-runner:8002}
  ANUBIS_QDRANT_URL: ${ANUBIS_QDRANT_URL:-http://qdrant:6333}
  ANUBIS_REDIS_URL: ${ANUBIS_REDIS_URL:-redis://redis:6379/0}
  ANUBIS_QDRANT_COLLECTION: ${ANUBIS_QDRANT_COLLECTION:-anubis_memory}
  ANUBIS_DATA_DIR: ${ANUBIS_DATA_DIR:-/var/lib/anubis}
  ANUBIS_ALLOWED_WORKSPACE: ${ANUBIS_ALLOWED_WORKSPACE:-/workspace/sandbox}
  ANUBIS_AUDIT_LOG_PATH: ${ANUBIS_AUDIT_LOG_PATH:-/var/log/anubis/tool-audit.jsonl}
  ANUBIS_LLM_PROVIDER: ${ANUBIS_LLM_PROVIDER:-mock}
  ANUBIS_REQUEST_TIMEOUT_SECONDS: ${ANUBIS_REQUEST_TIMEOUT_SECONDS:-30}
  ANUBIS_WORKERS: ${ANUBIS_WORKERS:-2}

x-health-python: &health-python
  interval: 15s
  timeout: 3s
  retries: 5
  start_period: 20s

services:
  ai-core:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.ai-core
      target: production
    image: anubis/ai-core:${ANUBIS_IMAGE_TAG:-local}
    environment:
      <<: *app-env
    expose:
      - "8000"
    depends_on:
      rag-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - anubis-internal
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      <<: *health-python
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"]
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  rag-service:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.rag
      target: production
    image: anubis/rag-service:${ANUBIS_IMAGE_TAG:-local}
    environment:
      <<: *app-env
    expose:
      - "8001"
    volumes:
      - rag_data:/var/lib/anubis
    depends_on:
      qdrant:
        condition: service_healthy
    networks:
      - anubis-internal
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      <<: *health-python
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2).read()"]
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  tool-runner:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.tool-runner
      target: production
    image: anubis/tool-runner:${ANUBIS_IMAGE_TAG:-local}
    environment:
      <<: *app-env
    expose:
      - "8002"
    volumes:
      - tool_sandbox:/workspace/sandbox
      - tool_audit:/var/log/anubis
    networks:
      - anubis-internal
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 20s
    healthcheck:
      <<: *health-python
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=2).read()"]
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  qdrant:
    image: qdrant/qdrant:v1.12.6
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
      - qdrant_snapshots:/qdrant/snapshots
      - ../qdrant/config/production.yaml:/qdrant/config/production.yaml:ro
    command: ["./qdrant", "--config-path", "/qdrant/config/production.yaml"]
    networks:
      - anubis-internal
    restart: unless-stopped
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 15s
      timeout: 3s
      retries: 10
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000", "--loglevel", "notice"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - anubis-internal
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

networks:
  anubis-internal:
    driver: bridge
    name: anubis-internal

volumes:
  qdrant_storage:
  qdrant_snapshots:
  redis_data:
  rag_data:
  tool_sandbox:
  tool_audit:
