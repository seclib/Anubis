services:
  anubis-agent:
    build:
      context: .
      args:
        USER_ID: ${UID:-1000}
        GROUP_ID: ${GID:-1000}
    image: anubis-agent:latest
    container_name: anubis-agent
    restart: unless-stopped
    init: true
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8000
      API_BASE_PATH: ${API_BASE_PATH:-/v1}
      API_AUTH_REQUIRED: "false"
      CONTINUOUS_RUN: "true"
      LOG_LEVEL: INFO
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-mistral}
      PROJECT_ROOT: /workspace
      WORKSPACE_ROOT: /workspace
      TOOL_COMMAND_TIMEOUT: ${TOOL_COMMAND_TIMEOUT:-120}
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./:/workspace
    working_dir: /workspace
    read_only: true
    tmpfs:
      - /tmp
      - /run
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "8000:8000"

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: anubis-open-webui
    restart: unless-stopped
    depends_on:
      - anubis-agent
    environment:
      WEBUI_NAME: Claude Code Local
      ENABLE_OPENAI_API: "true"
      ENABLE_OLLAMA_API: "false"
      OPENAI_API_BASE_URL: http://anubis-agent:8000/v1
      OPENAI_API_BASE_URLS: http://anubis-agent:8000/v1
      OPENAI_API_KEY: ignored
      OPENAI_API_KEYS: ignored
    volumes:
      - open-webui-data:/app/backend/data
    ports:
      - "3000:8080"

volumes:
  open-webui-data:
