services:
  # =========================
  # 🧠 QDRANT VECTOR SERVICE
  # =========================
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped

    ports:
      - "6333:6333"

    volumes:
      - qdrant_data:/qdrant/storage

    networks:
      - anubis-net

  # =========================
  # ⚡ REDIS REFLEX CACHE
  # =========================
  redis:
    image: redis:7-alpine
    container_name: anubis-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    command: redis-server --appendonly yes

    networks:
      - anubis-net

  # =========================
  # 🤖 ANUBIS AGENT
  # =========================
  anubis-agent:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

    build:
      context: .
      args:
        USER_ID: ${UID:-1000}
        GROUP_ID: ${GID:-1000}

    image: anubis-agent:latest
    container_name: anubis-agent

    restart: unless-stopped
    init: true

    user: "${UID:-1000}:${GID:-1000}"

    mem_limit: 2g
    cpus: 2

    environment:

      # 🌐 API
      API_HOST: 0.0.0.0
      API_PORT: 8000
      API_BASE_PATH: /v1

      # 🧠 OLLAMA (LOCAL)
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://localhost:11434}
      OLLAMA_MODEL: qwen2.5-coder:7b
      OLLAMA_FALLBACK_MODEL: qwen2.5-coder:7b
      OLLAMA_NUM_CTX: 8192
      OLLAMA_KEEP_ALIVE: 1h
      ORCHESTRATOR_AGENT_MODEL: qwen2.5-coder:7b
      PLANNER_AGENT_MODEL: qwen2.5-coder:7b
      CODER_AGENT_MODEL: qwen2.5-coder:7b
      REVIEWER_AGENT_MODEL: qwen2.5-coder:7b
      TESTER_AGENT_MODEL: qwen2.5-coder:7b
      DEBUGGER_AGENT_MODEL: qwen2.5-coder:7b
      MEMORY_AGENT_MODEL: qwen2.5-coder:7b
      LLM_TEMPERATURE: 0.2
      LLM_MAX_TOKENS: 4096

      # 🔥 MEMORY (QDRANT RESILIENT MODE)
      HERMES_MEMORY_ENABLED: "true"
      HERMES_MEMORY_BACKEND: qdrant
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_COLLECTION: hermes_memory
      REDIS_CACHE_ENABLED: "true"
      REDIS_CACHE_URL: ${REDIS_CACHE_URL:-redis://redis:6379/0}
      REDIS_CACHE_NAMESPACE: anubis:query_cache
      REDIS_CACHE_TTL_SECONDS: 604800

      # 🧠 fallback local memory (IMPORTANT FOR HEALING)
      HERMES_MEMORY_FILE: /workspace/state/hermes_memory.json

      # ⚡ resilience tuning
      QDRANT_RETRY_ATTEMPTS: 20
      QDRANT_RETRY_DELAY: 2

      CONTINUOUS_RUN: "false"
      AUTO_GIT_COMMIT_ENABLED: "true"

      # 📚 OBSIDIAN
      OBSIDIAN_VAULT_PATH: /obsidian
      OBSIDIAN_DAILY_MEMORY_DIR: memories

      # 📁 PATHS
      PROJECT_ROOT: /workspace
      WORKSPACE_ROOT: /workspace

    volumes:
      - anubis-workspace:/workspace
      - obsidian-vault:/obsidian

    working_dir: /workspace

    ports:
      - "8000:8000"

    networks:
      - anubis-net

  # =========================
  # 🛡️ SECURITY TOOLING
  # =========================
  metasploit:
    image: metasploitframework/metasploit-framework:latest
    container_name: anubis-metasploit
    restart: unless-stopped
    profiles:
      - exploit-tools
    init: true
    tty: true
    stdin_open: true
    command: sleep infinity
    environment:
      MSF_DATABASE_CONFIG: /home/msf/.msf4/database.yml
    volumes:
      - metasploit_data:/home/msf/.msf4
      - metasploit_loot:/home/msf/.msf4/loot
      - ./state/security-tools/metasploit:/workspace
    working_dir: /workspace
    networks:
      - anubis-security-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  bloodhound-neo4j:
    image: neo4j:4.4-community
    container_name: anubis-bloodhound-neo4j
    restart: unless-stopped
    profiles:
      - graph-tools
    environment:
      BLOODHOUND_NEO4J_PASSWORD: "${BLOODHOUND_NEO4J_PASSWORD:-anubis-local-change-me}"
      NEO4J_AUTH: "neo4j/${BLOODHOUND_NEO4J_PASSWORD:-anubis-local-change-me}"
      NEO4J_dbms_allow__upgrade: "true"
      NEO4J_dbms_default__listen__address: "0.0.0.0"
      NEO4J_dbms_connector_bolt_listen__address: "0.0.0.0:7687"
      NEO4J_dbms_connector_http_listen__address: "0.0.0.0:7474"
    volumes:
      - bloodhound_neo4j_data:/data
      - bloodhound_neo4j_logs:/logs
      - bloodhound_neo4j_import:/var/lib/neo4j/import
      - bloodhound_neo4j_plugins:/plugins
    expose:
      - "7474"
      - "7687"
    networks:
      - anubis-security-net
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${BLOODHOUND_NEO4J_PASSWORD:-anubis-local-change-me}\" 'RETURN 1' || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 12
    security_opt:
      - no-new-privileges:true

  bloodhound:
    image: bloodhoundad/bloodhound:latest
    container_name: anubis-bloodhound
    restart: unless-stopped
    profiles:
      - graph-tools
    depends_on:
      bloodhound-neo4j:
        condition: service_healthy
    environment:
      NEO4J_URI: bolt://bloodhound-neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: "${BLOODHOUND_NEO4J_PASSWORD:-anubis-local-change-me}"
    volumes:
      - bloodhound_data:/data
    ports:
      - "127.0.0.1:${BLOODHOUND_HTTP_PORT:-8080}:8080"
    networks:
      - anubis-security-net
    security_opt:
      - no-new-privileges:true


# =========================
# 💾 VOLUMES
# =========================
volumes:
  anubis-workspace:
    name: anubis-workspace
  obsidian-vault:
    name: obsidian-vault
  qdrant_data:
    name: qdrant_data
  redis_data:
    name: redis_data
  metasploit_data:
    name: anubis_metasploit_data
  metasploit_loot:
    name: anubis_metasploit_loot
  bloodhound_data:
    name: anubis_bloodhound_data
  bloodhound_neo4j_data:
    name: anubis_bloodhound_neo4j_data
  bloodhound_neo4j_logs:
    name: anubis_bloodhound_neo4j_logs
  bloodhound_neo4j_import:
    name: anubis_bloodhound_neo4j_import
  bloodhound_neo4j_plugins:
    name: anubis_bloodhound_neo4j_plugins


# =========================
# 🌐 NETWORK
# =========================
networks:
  anubis-net:
    name: anubis-net
    driver: bridge
  anubis-security-net:
    name: anubis-security-net
    driver: bridge
    internal: true
