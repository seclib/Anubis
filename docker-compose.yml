services:

  # =========================
  # 🧠 OLLAMA (LOCAL LLM)
  # =========================
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    networks:
      - anubis-net

  # =========================
  # 🤖 ANUBIS AGENT
  # =========================
  anubis-agent:
    build:
      context: .
      args:
        USER_ID: ${UID:-1000}
        GROUP_ID: ${GID:-1000}
    image: anubis-agent:latest
    container_name: anubis-agent
    restart: unless-stopped
    init: true

    user: "${UID:-1000}:${GID:-1000}"

    pids_limit: ${ANUBIS_PIDS_LIMIT:-256}
    mem_limit: ${ANUBIS_MEMORY_LIMIT:-2g}
    cpus: ${ANUBIS_CPUS:-2}

    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8000
      API_BASE_PATH: /v1

      CONTINUOUS_RUN: "true"
      AUTO_GIT_COMMIT_ENABLED: "true"

      # 👉 IMPORTANT FIX
      OLLAMA_BASE_URL: http://ollama:11434

      OLLAMA_MODEL: mistral
      EMBEDDING_MODEL: bge-m3
      HERMES_MEMORY_ENABLED: "true"
      HERMES_MEMORY_FILE: state/hermes_memory.json
      OBSIDIAN_VAULT_PATH: state/obsidian_vault

      PROJECT_ROOT: /workspace
      WORKSPACE_ROOT: /workspace

    volumes:
      - anubis-workspace:/workspace

    working_dir: /workspace

    ports:
      - "8000:8000"

    depends_on:
      - ollama

    networks:
      - anubis-net

  # =========================
  # 🌐 OPEN WEBUI
  # =========================
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: anubis-open-webui
    restart: unless-stopped

    depends_on:
      - ollama
      - anubis-agent

    ports:
      - "3000:8080"

    volumes:
      - open-webui-data:/app/backend/data

    environment:
      WEBUI_NAME: Anubis AI Stack

      # 👉 ACTIVE OLLAMA
      ENABLE_OLLAMA_API: "true"
      OLLAMA_BASE_URL: http://ollama:11434

      # 👉 Agent comme tool API
      ENABLE_OPENAI_API: "true"
      OPENAI_API_BASE_URL: http://anubis-agent:8000/v1
      OPENAI_API_KEY: ignored

    networks:
      - anubis-net

# =========================
# 📦 VOLUMES
# =========================
volumes:
  ollama_data:
  anubis-workspace:
  open-webui-data:

# =========================
# 🌐 NETWORK
# =========================
networks:
  anubis-net:
    driver: bridge
