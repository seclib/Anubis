
services:

  # =========================
  # 🧠 QDRANT (RAG MEMORY)
  # =========================
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped

    ports:
      - "6333:6333"

    volumes:
      - qdrant_data:/qdrant/storage

    networks:
      - anubis-net


  # =========================
  # 🤖 ANUBIS AGENT
  # =========================
  anubis-agent:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    build:
      context: .
      args:
        USER_ID: ${UID:-1000}
        GROUP_ID: ${GID:-1000}

    image: anubis-agent:latest
    container_name: anubis-agent

    restart: unless-stopped
    init: true

    user: "${UID:-1000}:${GID:-1000}"

    pids_limit: ${ANUBIS_PIDS_LIMIT:-256}
    mem_limit: ${ANUBIS_MEMORY_LIMIT:-2g}
    cpus: ${ANUBIS_CPUS:-2}

    environment:

      API_HOST: 0.0.0.0
      API_PORT: 8000
      API_BASE_PATH: /v1

      # 🧠 OLLAMA LOCAL HOST
      OLLAMA_BASE_URL: http://host.docker.internal:11434

      OLLAMA_MODEL: mistral
      EMBEDDING_MODEL: bge-m3

      # 🧠 HERMES MEMORY
      HERMES_MEMORY_ENABLED: "true"
      HERMES_MEMORY_BACKEND: qdrant
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: hermes_memory

      HERMES_MEMORY_FILE: /workspace/state/hermes_memory.json

      # 📚 OBSIDIAN
      OBSIDIAN_VAULT_PATH: /obsidian
      OBSIDIAN_DAILY_MEMORY_DIR: memories

      CONTINUOUS_RUN: "true"
      AUTO_GIT_COMMIT_ENABLED: "true"

      PROJECT_ROOT: /workspace
      WORKSPACE_ROOT: /workspace

    volumes:
      - anubis-workspace:/workspace

      # ⚠️ adapte le chemin si besoin
      - /home/fatsio/ObsidianVault:/obsidian:rw

    working_dir: /workspace

    ports:
      - "8000:8000"

    extra_hosts:
      - host.docker.internal:host-gateway

    depends_on:
      - qdrant

    networks:
      - anubis-net


volumes:
  anubis-workspace:
  qdrant_data:


networks:
  anubis-net:
    driver: bridge
