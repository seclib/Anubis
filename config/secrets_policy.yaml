secrets_management:
  strategy: external_reference_only
  inline_secrets: denied
  raw_secret_memory_storage: denied
  credential_memory_storage: external_reference_required
  secret_reference_format:
    required_fields:
      - provider
      - reference
      - purpose
      - owner
    forbidden_fields:
      - value
      - plaintext
      - token
      - password
      - private_key

providers:
  local_development:
    type: environment
    allowed: true
    notes: Use environment variable names as references only. Do not store values in repo.
  production:
    type: external_secret_manager
    allowed: true
    examples:
      - docker_secret
      - vault_path
      - cloud_secret_reference

runtime_rules:
  load_on_boot: false
  pass_to_plugins: false
  pass_to_agents: false
  audit_secret_access_attempts: true
  redact_logs: true
  redact_replacement: "[REDACTED]"

ci_rules:
  scan_repository_for_inline_secrets: required
  fail_on_secret_patterns: true
  allow_env_example_placeholders: true
